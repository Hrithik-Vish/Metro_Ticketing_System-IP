spring.application.name=metro-ticketing
server.port=${PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/metrodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Keep the connection pool small: Supabase poolers limit client connections, and fewer connections also speeds up startup.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Swagger UI (/swagger-ui/index.html): two groups, Metro Cards first, full API on request.
springdoc.group-configs[0].group=metro-cards
springdoc.group-configs[0].paths-to-match=/api/metro-cards/**
springdoc.group-configs[1].group=full-api
springdoc.group-configs[1].paths-to-match=/api/**
springdoc.swagger-ui.urls-primary-name=metro-cards
springdoc.swagger-ui.groups-order=DESC
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
